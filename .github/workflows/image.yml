# Build the container image and push it to GHCR.
# Runs on pushes to main, version tags, manual dispatch, and monthly so the
# `latest` image picks up base-image and dependency security fixes.
name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    # 1st of every month, 04:17 UTC (scheduled runs always use the default branch;
    # avoid :00 minutes, which GitHub delays under load).
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases `images` itself, but the registry cache ref
      # below goes straight to buildx and GHCR requires lowercase names.
      - name: Lowercase repository name
        run: echo "IMAGE_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=schedule,pattern={{date 'YYYYMM'}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub evicts Actions caches unused for 7 days, so a monthly run never
          # hits type=gha; the registry cache in GHCR persists between runs.
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ env.IMAGE_LC }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ env.IMAGE_LC }}:buildcache,mode=max
